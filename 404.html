<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic</title>
    
    <!-- Firebase -->
    <script type="module" src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js"></script>
    
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Material Icons & Fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-surface: #FFFBFE;
            --md-sys-color-surface-dim: #DED8E1;
            --md-sys-color-surface-bright: #FFFBFE;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-surface-container-low: #F7F2FA;
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-surface-container-highest: #E6E0E9;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-color-error: #B3261E;
            --md-ref-typeface: 'Roboto', sans-serif;
            --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
            --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--md-ref-typeface);
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            height: 100vh;
            overflow: hidden;
        }

        .m3-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 40px; padding: 0 24px; border-radius: 20px; border: none;
            font-family: var(--md-ref-typeface); font-size: 14px; font-weight: 500;
            cursor: pointer; transition: box-shadow 200ms, background-color 200ms;
        }
        .m3-btn-filled { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); box-shadow: var(--md-sys-elevation-1); }
        .m3-btn-filled:hover { box-shadow: var(--md-sys-elevation-2); }
        .m3-btn-outlined { background-color: transparent; color: var(--md-sys-color-primary); border: 1px solid var(--md-sys-color-outline); }
        .m3-btn-outlined:hover { background-color: rgba(103, 80, 164, 0.08); }
        .m3-btn-tonal { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
        .m3-btn-tonal:hover { box-shadow: var(--md-sys-elevation-1); }
        .m3-btn-text { background-color: transparent; color: var(--md-sys-color-primary); padding: 0 12px; }
        .m3-btn-text:hover { background-color: rgba(103, 80, 164, 0.08); }
        .m3-icon-btn {
            width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent;
            color: var(--md-sys-color-on-surface-variant); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .m3-icon-btn:hover { background-color: rgba(28, 27, 31, 0.08); }

        .m3-card-elevated {
            background-color: var(--md-sys-color-surface-container-low); border-radius: 12px;
            box-shadow: var(--md-sys-elevation-1); padding: 16px; cursor: pointer;
            transition: box-shadow 200ms, transform 150ms;
        }
        .m3-card-elevated:hover { box-shadow: var(--md-sys-elevation-2); transform: translateY(-2px); }

        .m3-dialog-overlay {
            display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.4);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .m3-dialog-overlay.active { display: flex; }
        .m3-dialog { background-color: var(--md-sys-color-surface-container-high); border-radius: 28px; padding: 24px; min-width: 320px; max-width: 560px; box-shadow: var(--md-sys-elevation-3); }
        .m3-dialog-title { font-size: 24px; font-weight: 500; margin-bottom: 16px; color: var(--md-sys-color-on-surface); }
        .m3-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
        .m3-textfield {
            width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--md-sys-color-outline);
            background: transparent; color: var(--md-sys-color-on-surface); font-family: var(--md-ref-typeface);
            font-size: 16px; outline: none; transition: border-color 200ms;
        }
        .m3-textfield:focus { border-color: var(--md-sys-color-primary); }

        .loading-screen { position: fixed; inset: 0; background: var(--md-sys-color-surface); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loading-spinner { width: 48px; height: 48px; border: 4px solid var(--md-sys-color-surface-container-highest); border-top-color: var(--md-sys-color-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #view-projects { height: 100vh; overflow-y: auto; padding: 32px; background-color: var(--md-sys-color-surface-dim); }
        .projects-header { max-width: 1200px; margin: 0 auto 24px; display: flex; justify-content: space-between; align-items: center; }
        .projects-title { font-size: 28px; font-weight: 700; color: var(--md-sys-color-on-surface); }
        .projects-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

        #view-editor { display: none; height: 100vh; flex-direction: column; background: var(--md-sys-color-surface); }
        .editor-top-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
        .project-name-input { border: none; background: transparent; font-size: 18px; font-weight: 500; color: var(--md-sys-color-on-surface); width: 250px; padding: 8px; border-radius: 8px; }
        .project-name-input:focus { background-color: var(--md-sys-color-surface-container-high); outline: none; }
        
        .file-tabs-container { display: flex; align-items: center; background-color: var(--md-sys-color-surface-container); padding: 0 8px; overflow-x: auto; }
        .file-tab { display: flex; align-items: center; padding: 12px 16px; font-size: 14px; color: var(--md-sys-color-on-surface-variant); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; position: relative; }
        .file-tab.active { color: var(--md-sys-color-primary); border-bottom-color: var(--md-sys-color-primary); background-color: var(--md-sys-color-surface-container-lowest); border-radius: 8px 8px 0 0; }
        .file-tab .delete-file-btn { margin-left: 8px; width: 18px; height: 18px; border-radius: 50%; border: none; background: transparent; color: var(--md-sys-color-on-surface-variant); font-size: 16px; cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 1; }
        .file-tab:hover .delete-file-btn { display: flex; }
        .file-tab .delete-file-btn:hover { background-color: rgba(179, 38, 30, 0.1); color: var(--md-sys-color-error); }
        .editor-area { flex-grow: 1; overflow: hidden; }

        .CodeMirror { height: 100%; background-color: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface); font-family: 'Roboto Mono', monospace; }
        .CodeMirror-gutters { background-color: var(--md-sys-color-surface-container-low); border-right: 1px solid var(--md-sys-color-outline-variant); }
        .CodeMirror-linenumber { color: var(--md-sys-color-outline); }
        .CodeMirror-cursor { border-left: 2px solid var(--md-sys-color-primary); }
        .CodeMirror-selected { background: rgba(103, 80, 164, 0.2) !important; }
        .cm-s-default .cm-keyword { color: #6750A4; font-weight: 500; }
        .cm-s-default .cm-def { color: #0061A4; }
        .cm-s-default .cm-variable { color: #1C1B1F; }
        .cm-s-default .cm-string { color: #386A20; }
        .cm-s-default .cm-tag { color: #0061A4; }
        .cm-s-default .cm-attribute { color: #6750A4; }

        #view-render { display: none; position: fixed; inset: 0; background: white; z-index: -1; }
        #view-render iframe { width: 100%; height: 100%; border: none; }

        .snackbar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background-color: var(--md-sys-color-on-surface); color: var(--md-sys-color-surface); padding: 14px 24px; border-radius: 12px; font-size: 14px; z-index: 2000; transition: transform 300ms cubic-bezier(0.2, 0, 0, 1); box-shadow: var(--md-sys-elevation-3); max-width: 90%; word-wrap: break-word;}
        .snackbar.show { transform: translateX(-50%) translateY(0); }

        .share-link-box { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        .share-link-box input { flex: 1; padding: 10px; border: 1px solid var(--md-sys-color-outline); border-radius: 8px; background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface); font-size: 14px; }
    </style>
</head>
<body>

    <div class="loading-screen" id="loading"><div class="loading-spinner"></div></div>

    <!-- VIEW 1: Projects -->
    <div id="view-projects" style="display:none;">
        <div class="projects-header">
            <h1 class="projects-title">Mimic</h1>
            <button class="m3-btn m3-btn-filled" id="btn-new-project">
                <span class="material-icons-round" style="font-size:18px;">add</span> New Project
            </button>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
    </div>

    <!-- VIEW 2: Editor -->
    <div id="view-editor">
        <div class="editor-top-bar">
            <div style="display:flex; align-items:center; gap:8px;">
                <button class="m3-icon-btn" id="btn-back"><span class="material-icons-round">arrow_back</span></button>
                <input type="text" class="project-name-input" id="inp-project-name" placeholder="Project Name">
                <button class="m3-icon-btn" id="btn-settings"><span class="material-icons-round">tune</span></button>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="m3-btn m3-btn-tonal" id="btn-save-zip">
                    <span class="material-icons-round" style="font-size:18px;">download</span> Save
                </button>
                <button class="m3-btn m3-btn-filled" id="btn-run">
                    <span class="material-icons-round" style="font-size:18px;">play_arrow</span> Run
                </button>
                <button class="m3-btn m3-btn-outlined" id="btn-share">
                    <span class="material-icons-round" style="font-size:18px;">share</span> Share
                </button>
            </div>
        </div>
        <div class="file-tabs-container" id="file-tabs"></div>
        <div class="editor-area">
            <textarea id="cm-textarea"></textarea>
        </div>
    </div>

    <!-- VIEW 3: Render -->
    <div id="view-render"><iframe id="render-iframe"></iframe></div>

    <!-- MODALS -->
    <div class="m3-dialog-overlay" id="modal-add-file">
        <div class="m3-dialog">
            <div class="m3-dialog-title">Create New File</div>
            <input type="text" class="m3-textfield" id="inp-new-file" placeholder="e.g., app.js, utils.css">
            <div class="m3-dialog-actions">
                <button class="m3-btn m3-btn-text" id="btn-cancel-file">Cancel</button>
                <button class="m3-btn m3-btn-filled" id="btn-confirm-add-file">Create</button>
            </div>
        </div>
    </div>

    <div class="m3-dialog-overlay" id="modal-share">
        <div class="m3-dialog">
            <div class="m3-dialog-title">Share Project</div>
            <p style="margin-bottom:16px; color:var(--md-sys-color-on-surface-variant); font-size:14px;">Anyone with these links can view the running project.</p>
            <label style="font-size:12px; color:var(--md-sys-color-on-surface-variant); margin-bottom:4px; display:block;">PUBLIC LINK</label>
            <div class="share-link-box"><input type="text" id="link-public" readonly><button class="m3-btn m3-btn-tonal" id="copy-pub">Copy</button></div>
            <label style="font-size:12px; color:var(--md-sys-color-on-surface-variant); margin-bottom:4px; display:block;">PRIVATE LINK</label>
            <div class="share-link-box"><input type="text" id="link-private" readonly><button class="m3-btn m3-btn-tonal" id="copy-pvt">Copy</button></div>
            <div class="m3-dialog-actions"><button class="m3-btn m3-btn-text" id="btn-close-share">Close</button></div>
        </div>
    </div>

    <div class="m3-dialog-overlay" id="modal-settings">
        <div class="m3-dialog">
            <div class="m3-dialog-title">Settings</div>
            <div style="display:flex; flex-direction:column; gap:16px;">
                <div>
                    <label style="font-size:14px; color:var(--md-sys-color-on-surface-variant);">Tab Size</label>
                    <input type="number" class="m3-textfield" id="set-tabsize" value="2" min="1" max="8" style="margin-top:8px;">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="font-size:14px; color:var(--md-sys-color-on-surface-variant);">Word Wrap</label>
                    <label class="material-icons-round" style="cursor:pointer; color:var(--md-sys-color-primary); font-size:32px;" id="toggle-wrap">
                        <input type="checkbox" style="display:none;" id="set-wordwrap">
                        check_box_outline_blank
                    </label>
                </div>
            </div>
            <div class="m3-dialog-actions">
                <button class="m3-btn m3-btn-text" id="btn-cancel-settings">Cancel</button>
                <button class="m3-btn m3-btn-filled" id="btn-save-settings">Apply</button>
            </div>
        </div>
    </div>

    <div class="snackbar" id="snackbar"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBk_9ZoyexrPZON-JowtMeNgWCzpfsQyeM",
            authDomain: "mimic-799e5.firebaseapp.com",
            databaseURL: "https://mimic-799e5-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mimic-799e5",
            storageBucket: "mimic-799e5.firebasestorage.app",
            messagingSenderId: "914081698620",
            appId: "1:914081698620:web:2bb171c9afb66efa66c439",
            measurementId: "G-5TP997CQC8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const BASE_URL = "https://bw00111.github.io/mimic";

        let currentProjectId = null;
        let projectData = null;
        let currentFileName = "index.html";
        let editor = null;
        let saveTimeout = null;

        // Utilities
        function showView(viewId) {
            document.querySelectorAll('[id^="view-"]').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = viewId === 'view-editor' ? 'flex' : 'block';
        }

        function showSnackbar(msg) {
            const sb = document.getElementById('snackbar');
            sb.textContent = msg;
            sb.classList.add('show');
            setTimeout(() => sb.classList.remove('show'), 4000); // Longer display to read errors
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function copyLink(id) {
            navigator.clipboard.writeText(document.getElementById(id).value);
            showSnackbar("Link copied!");
        }

        function getModeFromFilename(name) {
            if (name.endsWith('.html') || name.endsWith('.htm')) return 'htmlmixed';
            if (name.endsWith('.css')) return 'css';
            if (name.endsWith('.js')) return 'javascript';
            if (name.endsWith('.json')) return 'application/json';
            return 'text/plain';
        }

        // --- PUBLIC VIEW LOGIC ---
        async function handlePublicRoute() {
            try {
                const path = window.location.pathname;
                let isPublic = path.includes('/pub/');
                let isPrivate = path.includes('/pv/');
                
                if (!isPublic && !isPrivate) return false;

                const parts = path.replace(/\/$/, '').split('/');
                const projectId = parts[parts.length - 1];

                const snap = await get(ref(db, `projects/${projectId}`));
                if (snap.exists()) {
                    const data = snap.val();
                    document.title = data.name || "Mimic Project";
                    
                    // Ensure data.files is an array (handles old broken data gracefully)
                    const files = Array.isArray(data.files) ? data.files : [];
                    const htmlObj = files.find(f => f.name === 'index.html');
                    let htmlContent = htmlObj ? htmlObj.content : '<h1>No index.html found</h1>';
                    
                    files.forEach(file => {
                        if (file.name.endsWith('.css') && !htmlContent.includes(file.name)) {
                            htmlContent = htmlContent.replace('</head>', `<style>\n${file.content}\n</style>\n</head>`);
                        }
                        if (file.name.endsWith('.js') && !htmlContent.includes(file.name)) {
                            htmlContent = htmlContent.replace('</body>', `<script>\n${file.content}\n<\/script>\n</body>`);
                        }
                    });

                    document.getElementById('loading').style.display = 'none';
                    showView('view-render');
                    document.getElementById('render-iframe').srcdoc = htmlContent;
                    return true;
                }
            } catch (error) {
                console.error("Public route error:", error);
            }
            return false;
        }

        // --- PROJECT LIST VIEW ---
        async function loadProjects() {
            try {
                showView('view-projects');
                document.getElementById('loading').style.display = 'none';
                const grid = document.getElementById('projects-grid');
                grid.innerHTML = '';

                const snap = await get(ref(db, 'projects'));
                if (!snap.exists()) {
                    grid.innerHTML = '<p style="color:var(--md-sys-color-on-surface-variant)">No projects yet. Click "New Project" to start.</p>';
                    return;
                }

                Object.entries(snap.val()).forEach(([id, proj]) => {
                    const card = document.createElement('div');
                    card.className = 'm3-card-elevated';
                    const date = proj.lastModified ? new Date(proj.lastModified).toLocaleDateString() : '';
                    card.innerHTML = `
                        <h3 style="margin-bottom:8px; font-weight:500;">${proj.name || 'Untitled'}</h3>
                        <p style="font-size:12px; color:var(--md-sys-color-on-surface-variant);">Modified: ${date}</p>
                    `;
                    card.onclick = () => openEditor(id);
                    grid.appendChild(card);
                });
            } catch (error) {
                showSnackbar("Failed to load projects: " + error.message);
            }
        }

        async function createProject() {
            try {
                showSnackbar("Creating project..."); // Instant visual feedback
                const id = Date.now().toString();
                
                const newProj = {
                    name: "Untitled Project",
                    lastModified: Date.now(),
                    files: [
                        { name: "index.html", content: "<!DOCTYPE html>\n<html>\n<head>\n  <title>New Project</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <h1>Hello World</h1>\n  <script src=\"script.js\"><\/script>\n</body>\n</html>" },
                        { name: "style.css", content: "body {\n  font-family: sans-serif;\n  padding: 20px;\n  background: #f0f0f0;\n}" },
                        { name: "script.js", content: "console.log('Ready to code!');" }
                    ]
                };
                
                await set(ref(db, `projects/${id}`), newProj);
                openEditor(id);
            } catch (error) {
                console.error("Create Error:", error);
                showSnackbar("Error creating project: " + error.message);
            }
        }

        // --- EDITOR VIEW ---
        async function openEditor(id) {
            try {
                showSnackbar("Loading editor...");
                currentProjectId = id;
                const snap = await get(ref(db, `projects/${id}`));
                
                if (!snap.exists()) {
                    showSnackbar("Error: Project was deleted");
                    loadProjects();
                    return;
                }
                
                projectData = snap.val();
                
                // Convert old object files to array if user has old broken data in DB
                if (!Array.isArray(projectData.files)) {
                    projectData.files = Object.entries(projectData.files || {}).map(([name, content]) => ({name, content}));
                }
                
                document.getElementById('inp-project-name').value = projectData.name;
                
                showView('view-editor');
                initEditorIfNeeded();
                renderTabs();
                switchFile("index.html");
                showSnackbar("Project loaded!"); // Success confirmation
            } catch (error) {
                console.error("Open Editor Error:", error);
                showSnackbar("Failed to open project: " + error.message);
            }
        }

        function initEditorIfNeeded() {
            if (editor) return;
            editor = CodeMirror.fromTextArea(document.getElementById('cm-textarea'), {
                lineNumbers: true, tabSize: 2, indentUnit: 2, mode: 'htmlmixed'
            });
            editor.on('change', () => {
                if (!projectData) return;
                const fileObj = projectData.files.find(f => f.name === currentFileName);
                if (fileObj) fileObj.content = editor.getValue();
                
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(autoSaveToFirebase, 1500);
            });
        }

        function renderTabs() {
            const container = document.getElementById('file-tabs');
            container.innerHTML = ''; 
            
            projectData.files.forEach(file => {
                const tab = document.createElement('div');
                tab.className = `file-tab ${file.name === currentFileName ? 'active' : ''}`;
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = file.name;
                nameSpan.onclick = () => switchFile(file.name);
                tab.appendChild(nameSpan);
                
                if (projectData.files.length > 1) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-file-btn';
                    delBtn.innerHTML = '×';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteFile(file.name);
                    };
                    tab.appendChild(delBtn);
                }
                container.appendChild(tab);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'm3-icon-btn';
            addBtn.title = 'Add File';
            addBtn.innerHTML = '<span class="material-icons-round">note_add</span>';
            addBtn.onclick = () => document.getElementById('modal-add-file').classList.add('active');
            container.appendChild(addBtn);
        }

        function switchFile(fName) {
            currentFileName = fName;
            const fileObj = projectData.files.find(f => f.name === fName);
            editor.setValue(fileObj ? fileObj.content : "");
            editor.setOption('mode', getModeFromFilename(fName));
            editor.clearHistory();
            renderTabs(); 
            setTimeout(() => editor.refresh(), 10);
        }

        async function deleteFile(fName) {
            try {
                if (projectData.files.length <= 1) return showSnackbar("Must have at least one file");
                if (!confirm(`Delete ${fName}?`)) return; 
                
                projectData.files = projectData.files.filter(f => f.name !== fName);
                
                await set(ref(db, `projects/${currentProjectId}/files`), projectData.files);
                switchFile(projectData.files[0].name);
                showSnackbar(`Deleted ${fName}`);
            } catch (error) {
                showSnackbar("Delete failed: " + error.message);
            }
        }

        async function addNewFile() {
            try {
                const inp = document.getElementById('inp-new-file');
                let fName = inp.value.trim();
                if (!fName) return;
                if (!fName.includes('.')) return showSnackbar("Please include file extension (e.g. .js)");
                if (projectData.files.find(f => f.name === fName)) return showSnackbar("File already exists");

                projectData.files.push({ name: fName, content: "" });
                
                await set(ref(db, `projects/${currentProjectId}/files`), projectData.files);
                
                closeModal('modal-add-file');
                inp.value = '';
                switchFile(fName);
                showSnackbar(`Created ${fName}`);
            } catch (error) {
                showSnackbar("Add file failed: " + error.message);
            }
        }

        async function autoSaveToFirebase() {
            try {
                if (!currentProjectId) return;
                projectData.name = document.getElementById('inp-project-name').value;
                projectData.lastModified = Date.now();
                await update(ref(db, `projects/${currentProjectId}`), {
                    name: projectData.name,
                    lastModified: projectData.lastModified,
                    files: projectData.files
                });
            } catch (error) {
                console.error("Autosave failed:", error);
                // Don't spam snackbar for autosave to avoid annoying the user while typing
            }
        }

        function downloadZip() {
            try {
                if (!projectData) return;
                const zip = new JSZip();
                projectData.files.forEach(file => zip.file(file.name, file.content));
                zip.generateAsync({ type: "blob" }).then(blob => {
                    saveAs(blob, `${projectData.name.replace(/\s+/g, '_')}.zip`);
                    showSnackbar("Download started!");
                });
            } catch (error) {
                showSnackbar("Zip failed: " + error.message);
            }
        }

        function runProject() {
            try {
                if (!currentProjectId) return;
                showSnackbar("Saving & running...");
                autoSaveToFirebase(); 
                setTimeout(() => {
                    window.open(`${BASE_URL}/pub/${currentProjectId}`, '_blank');
                }, 500); // Give it half a second to save
            } catch (error) {
                showSnackbar("Run failed: " + error.message);
            }
        }

        function openShareModal() {
            if (!currentProjectId) return;
            document.getElementById('link-public').value = `${BASE_URL}/pub/${currentProjectId}`;
            document.getElementById('link-private').value = `${BASE_URL}/pv/${currentProjectId}`;
            document.getElementById('modal-share').classList.add('active');
        }

        function applySettings() {
            try {
                const size = parseInt(document.getElementById('set-tabsize').value) || 2;
                const wrap = document.getElementById('set-wordwrap').checked;
                if (editor) {
                    editor.setOption('tabSize', size);
                    editor.setOption('indentUnit', size);
                    editor.setOption('lineWrapping', wrap);
                }
                closeModal('modal-settings');
                showSnackbar("Settings applied");
            } catch (error) {
                showSnackbar("Settings failed: " + error.message);
            }
        }

        // --- INIT & EVENTS ---
        async function init() {
            try {
                if (await handlePublicRoute()) return;

                document.getElementById('btn-new-project').onclick = createProject;
                document.getElementById('btn-back').onclick = () => { currentProjectId = null; projectData = null; loadProjects(); };
                document.getElementById('btn-save-zip').onclick = downloadZip;
                document.getElementById('btn-run').onclick = runProject;
                document.getElementById('btn-share').onclick = openShareModal;
                document.getElementById('btn-settings').onclick = () => document.getElementById('modal-settings').classList.add('active');
                
                document.getElementById('btn-save-settings').onclick = applySettings;
                document.getElementById('btn-cancel-settings').onclick = () => closeModal('modal-settings');
                
                document.getElementById('btn-confirm-add-file').onclick = addNewFile;
                document.getElementById('btn-cancel-file').onclick = () => closeModal('modal-add-file');
                document.getElementById('inp-new-file').addEventListener('keypress', (e) => { if (e.key === 'Enter') addNewFile(); });
                
                document.getElementById('copy-pub').onclick = () => copyLink('link-public');
                document.getElementById('copy-pvt').onclick = () => copyLink('link-private');
                document.getElementById('btn-close-share').onclick = () => closeModal('modal-share');

                document.getElementById('toggle-wrap').addEventListener('click', function() {
                    const cb = document.getElementById('set-wordwrap');
                    cb.checked = !cb.checked;
                    this.innerHTML = cb.checked ? 'check_box' : 'check_box_outline_blank';
                });

                loadProjects();
            } catch (error) {
                console.error("INIT FATAL ERROR:", error);
                alert("Fatal Error starting app: " + error.message);
                document.getElementById('loading').style.display = 'none'; // Hide spinner at least
            }
        }

        init();
    </script>
</body>
</html>
