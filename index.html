<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Voice Assistant</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
}

.mic-container{
    width:180px;
    height:180px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    position:relative;
    box-shadow:
    0 0 20px #2563eb,
    0 0 60px #2563eb;
    animation:pulse 2s infinite;
}

.mic-container i{
    font-size:70px;
    color:white;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }
}

.status{
    font-size:20px;
    color:#93c5fd;
}

.text-box{
    width:320px;
    text-align:center;
    background:#111827;
    padding:20px;
    border-radius:20px;
    line-height:1.6;
}

.label{
    color:#60a5fa;
    margin-bottom:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="mic-container">
        <i class="fa-solid fa-microphone"></i>
    </div>

    <div class="status" id="status">
        Initializing...
    </div>

    <div class="text-box">
        <div class="label">You Said</div>
        <div id="userText">...</div>
    </div>

    <div class="text-box">
        <div class="label">AI Response</div>
        <div id="aiText">...</div>
    </div>

</div>

<script>
const statusBox = document.getElementById("status");
const userText = document.getElementById("userText");
const aiText = document.getElementById("aiText");

// ===========================
// API KEY OBFUSCATION
// ===========================
const salted =
"mySalt_" +
"REPLACE_WITH_YOUR_KEY";

const encoded1 = btoa(salted);
const encoded2 = btoa(encoded1);
const encoded3 = btoa(encoded2);

// Decode
function decodeKey(){

    const step1 = atob(encoded3);
    const step2 = atob(step1);
    const step3 = atob(step2);

    return step3.replace("mySalt_", "");
}

const API_KEY = decodeKey();

// ===========================
// MODEL
// ===========================
const MODEL =
"google/gemma-4-26b-a4b-it:free";

// ===========================
// SPEECH RECOGNITION
// ===========================
const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const recognition =
new SpeechRecognition();

recognition.continuous = false;
recognition.interimResults = false;
recognition.lang = "si-LK";

let isSpeaking = false;
let lastReply = "";

// ===========================
// START LISTENING
// ===========================
function startListening(){

    if(isSpeaking) return;

    try{

        recognition.start();

        statusBox.innerText =
        "🎤 Listening...";

    }catch(err){

        console.log(err);
    }
}

// ===========================
// STOP LISTENING
// ===========================
function stopListening(){

    try{
        recognition.stop();
    }catch(e){}
}

// ===========================
// SINHALA DETECTION
// ===========================
function isSinhala(text){

    return /[\u0D80-\u0DFF]/.test(text);
}

// ===========================
// SPEAK
// ===========================
function speak(text){

    stopListening();

    isSpeaking = true;

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang =
    isSinhala(text)
    ? "si-LK"
    : "en-US";

    speech.rate = 1;
    speech.pitch = 1;

    speech.onstart = () => {

        statusBox.innerText =
        "🗣️ Speaking...";
    };

    speech.onend = () => {

        isSpeaking = false;

        statusBox.innerText =
        "🎤 Listening...";

        // IMPORTANT DELAY
        setTimeout(() => {

            startListening();

        }, 1200);
    };

    speechSynthesis.cancel();
    speechSynthesis.speak(speech);
}

// ===========================
// ASK AI
// ===========================
async function askAI(message){

    try{

        statusBox.innerText =
        "🧠 Thinking...";

        const response = await fetch(
        "https://openrouter.ai/api/v1/chat/completions",
        {
            method:"POST",

            headers:{
                "Authorization":
                `Bearer ${API_KEY}`,

                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                model:MODEL,

                messages:[
                    {
                        role:"system",

                        content:
`You are a voice assistant.

Rules:
- Keep replies short
- Reply naturally
- If the user speaks Sinhala,
reply in Sinhala.
- If English, reply in English.`
                    },

                    {
                        role:"user",
                        content:message
                    }
                ]
            })
        });

        const data =
        await response.json();

        console.log(data);

        const reply =
        data.choices?.[0]
        ?.message?.content
        || "Sorry.";

        lastReply = reply;

        aiText.innerText = reply;

        speak(reply);

    }catch(error){

        console.log(error);

        aiText.innerText =
        "Connection Error";

        speak("Connection error");
    }
}

// ===========================
// RESULT
// ===========================
recognition.onresult =
async (event) => {

    if(isSpeaking) return;

    const transcript =
    event.results[0][0]
    .transcript.trim();

    // Ignore AI echo
    if(
        transcript.toLowerCase()
        ===
        lastReply.toLowerCase()
    ){
        startListening();
        return;
    }

    userText.innerText =
    transcript;

    await askAI(transcript);
};

// ===========================
// ERRORS
// ===========================
recognition.onerror =
(event) => {

    console.log(event.error);

    setTimeout(() => {

        if(!isSpeaking){

            startListening();
        }

    }, 1000);
};

// ===========================
// END
// ===========================
recognition.onend = () => {

    if(!isSpeaking){

        setTimeout(() => {

            startListening();

        }, 1000);
    }
};

// ===========================
// INIT
// ===========================
async function init(){

    await navigator
    .mediaDevices
    .getUserMedia({
        audio:true
    });

    startListening();
}

init();
</script>

</body>
</html>
