<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            background-color: black; /* Black background */
        }
        #container {
            position: relative;
            width: 100vw; /* Full viewport width */
            height: 100vh; /* Full viewport height */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cover the entire container */
            transform: scaleX(-1); /* Mirror the camera if it's front-facing, adjust for rear */
            z-index: 1;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Render canvas on top of video */
        }
        /* Ensure landscape orientation (this is more of a suggestion for the user than an enforcement) */
        @media screen and (orientation: portrait) {
            body {
                transform: rotate(-90deg);
                transform-origin: bottom left;
                width: 100vh;
                height: 100vw;
                position: absolute;
                top: 100%;
                left: 0;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="cameraFeed" autoplay playsinline></video>
        <canvas id="handTrackingCanvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('cameraFeed');
        const canvasElement = document.getElementById('handTrackingCanvas');
        const canvasCtx = canvasElement.getContext('2d');

        // Set canvas dimensions to match viewport
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;

        // Function to get camera feed
        async function setupCamera() {
            try {
                // Request rear camera if possible, or any available video input
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: "environment" }, // Prioritize rear camera
                        width: { ideal: 1920 }, // Request high resolution
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60, min: 30 } // Request high frame rate
                    }
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                console.log('Camera started successfully.');

                // Optional: Get actual camera settings
                const track = stream.getVideoTracks()[0];
                if (track) {
                    const settings = track.getSettings();
                    console.log('Camera settings:', settings);
                }

            } catch (error) {
                console.error('Error accessing camera:', error);
                alert('Could not access the camera. Please ensure permissions are granted.');
            }
        }

        // Call the camera setup function when the page loads
        window.addEventListener('load', setupCamera);
        window.addEventListener('resize', () => {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            // You would also need to re-render your 3D scene if you had one
        });

        // Placeholder for hand tracking and 3D rendering logic
        // This is where you would integrate libraries like MediaPipe for tracking
        // and Three.js for 3D rendering the hand mesh onto the canvas.
        // This part is highly complex and cannot be fully provided in a simple snippet.
        function animate() {
            // This function would be called repeatedly to update the hand tracking
            // and render the 3D mesh.
            // Example:
            // if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
            //     // Process video frame with hand tracking model
            //     // Update 3D hand mesh based on tracking results
            //     // Render 3D mesh onto the canvas
            // }
            requestAnimationFrame(animate);
        }
        // animate(); // Start the animation loop once actual tracking/rendering is integrated
    </script>
</body>
</html>
