<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic Editor</title>
    <!-- Material 3 Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <!-- JSZip for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --md-sys-color-primary: #000000;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-surface: #fcfcfc;
            --md-sys-color-outline: #79747e;
            --background: #ffffff;
            --text: #000000;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--background);
            color: var(--text);
            height: 100%;
            overflow: hidden;
        }

        /* Dashboard Styles */
        #dashboard { display: flex; flex-direction: column; height: 100vh; padding: 20px; box-sizing: border-box; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
        .project-card { 
            border: 1px solid #ddd; padding: 16px; border-radius: 12px; 
            cursor: pointer; transition: 0.2s; position: relative;
        }
        .project-card:hover { background: #f0f0f0; }

        /* Editor Styles */
        #editor-container { display: none; flex-direction: column; height: 100vh; }
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 8px 16px; border-bottom: 1px solid #ddd;
        }
        .main-editor { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 200px; border-right: 1px solid #ddd; padding: 10px; background: #f9f9f9; }
        .code-area { flex: 1; position: relative; }
        textarea { 
            width: 100%; height: 100%; border: none; outline: none; 
            font-family: 'Courier New', monospace; font-size: 14px; padding: 15px;
            resize: none; box-sizing: border-box;
        }

        /* Buttons & Components */
        .btn {
            background: var(--md-sys-color-primary); color: white;
            border: none; padding: 8px 16px; border-radius: 20px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            font-size: 14px;
        }
        .btn-outline { background: transparent; color: black; border: 1px solid black; }
        .file-item { 
            padding: 8px; border-radius: 8px; cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .file-item.active { background: #e0e0e0; font-weight: bold; }
        .file-item i { font-size: 16px; color: #666; }

        /* Modal */
        #settings-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 24px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 100; border: 1px solid #eee; min-width: 300px;
        }

        .loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 3px; 
            background: #eee; overflow: hidden; display: none;
        }
        .loader div { width: 30%; height: 100%; background: #000; animation: move 1s infinite linear; }
        @keyframes move { from { margin-left: -30%; } to { margin-left: 100%; } }

        input[type="text"] { border: none; border-bottom: 1px solid #ccc; padding: 5px; outline: none; font-size: 16px; }
    </style>
</head>
<body>

    <div class="loader" id="global-loader"><div></div></div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Mimic.</h1>
            <button class="btn" onclick="createNewProject()">
                <i class="material-icons-sharp">add</i> New Project
            </button>
        </div>
        <div class="project-grid" id="project-list">
            <!-- Projects injected here -->
        </div>
    </div>

    <!-- EDITOR -->
    <div id="editor-container">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="btn-outline btn" onclick="window.location.href=window.location.pathname" style="padding: 5px;"><i class="material-icons-sharp">arrow_back</i></button>
                <input type="text" id="project-name-input" placeholder="Project Name" onchange="updateProjectName(this.value)">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-outline btn" onclick="toggleSettings()"><i class="material-icons-sharp">settings</i></button>
                <button class="btn-outline btn" onclick="downloadZip()"><i class="material-icons-sharp">download</i> Save</button>
                <button class="btn-outline btn" onclick="shareProject()"><i class="material-icons-sharp">share</i> Share</button>
                <button class="btn" onclick="runProject()"><i class="material-icons-sharp">play_arrow</i> Run</button>
            </div>
        </header>
        <div class="main-editor">
            <div class="sidebar">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <b>Files</b>
                    <i class="material-icons-sharp" style="cursor:pointer" onclick="addNewFile()">add</i>
                </div>
                <div id="file-list"></div>
            </div>
            <div class="code-area">
                <textarea id="editor-textarea" spellcheck="false" placeholder="Write code here..."></textarea>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <h3>Settings</h3>
        <p>Project ID: <span id="set-project-id"></span></p>
        <button class="btn" onclick="deleteCurrentProject()" style="background: #ba1a1a;">Delete Project</button>
        <br>
        <button class="btn-outline btn" onclick="toggleSettings()">Close</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBk_9ZoyexrPZON-JowtMeNgWCzpfsQyeM",
            authDomain: "mimic-799e5.firebaseapp.com",
            databaseURL: "https://mimic-799e5-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mimic-799e5",
            storageBucket: "mimic-799e5.firebasestorage.app",
            messagingSenderId: "914081698620",
            appId: "1:914081698620:web:2bb171c9afb66efa66c439",
            measurementId: "G-5TP997CQC8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Management
        let currentProjectId = null;
        let currentFile = 'index.html';
        let projectData = null;
        let saveTimeout = null;

        // --- ROUTER ---
        function route() {
            const params = new URLSearchParams(window.location.search);
            const editId = params.get('edit');
            const viewId = params.get('view');

            if (viewId) {
                renderLiveSite(viewId);
            } else if (editId) {
                loadEditor(editId);
            } else {
                showDashboard();
            }
        }

        // --- DASHBOARD LOGIC ---
        function showDashboard() {
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('editor-container').style.display = 'none';
            
            onValue(ref(db, 'projects'), (snapshot) => {
                const data = snapshot.val();
                const container = document.getElementById('project-list');
                container.innerHTML = '';
                if(data) {
                    Object.keys(data).forEach(id => {
                        const div = document.createElement('div');
                        div.className = 'project-card';
                        div.innerHTML = `<b>${data[id].name || 'Untitled'}</b><br><small>${id}</small>`;
                        div.onclick = () => window.location.search = `?edit=${id}`;
                        container.appendChild(div);
                    });
                }
            });
        }

        window.createNewProject = async function() {
            const newProjRef = push(ref(db, 'projects'));
            const initialData = {
                name: "New Project",
                files: {
                    "index.html": "<html>\n<body>\n  <h1>Hello World</h1>\n</body>\n</html>",
                    "style.css": "body { background: white; }",
                    "script.js": "console.log('Hello from Mimic');"
                }
            };
            await set(newProjRef, initialData);
            window.location.search = `?edit=${newProjRef.key}`;
        }

        // --- EDITOR LOGIC ---
        function loadEditor(id) {
            currentProjectId = id;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('editor-container').style.display = 'flex';
            document.getElementById('set-project-id').innerText = id;

            onValue(ref(db, `projects/${id}`), (snapshot) => {
                projectData = snapshot.val();
                if(!projectData) return;
                document.getElementById('project-name-input').value = projectData.name;
                renderFileList();
                if(!document.activeElement.tagName === 'TEXTAREA') {
                    updateEditorContent();
                }
            });
        }

        function renderFileList() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            Object.keys(projectData.files).forEach(filename => {
                const div = document.createElement('div');
                div.className = `file-item ${currentFile === filename ? 'active' : ''}`;
                div.innerHTML = `<span>${filename}</span> <i class="material-icons-sharp" style="font-size:14px" onclick="deleteFile('${filename}')">close</i>`;
                div.onclick = (e) => {
                    if(e.target.tagName !== 'I') {
                        currentFile = filename;
                        updateEditorContent();
                        renderFileList();
                    }
                };
                list.appendChild(div);
            });
        }

        function updateEditorContent() {
            const textarea = document.getElementById('editor-textarea');
            textarea.value = projectData.files[currentFile] || "";
        }

        // Autosave Logic
        document.getElementById('editor-textarea').addEventListener('input', (e) => {
            const content = e.target.value;
            document.getElementById('global-loader').style.display = 'block';
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                update(ref(db, `projects/${currentProjectId}/files`), {
                    [currentFile]: content
                }).then(() => {
                    document.getElementById('global-loader').style.display = 'none';
                });
            }, 1000);
        });

        window.updateProjectName = function(val) {
            update(ref(db, `projects/${currentProjectId}`), { name: val });
        }

        window.addNewFile = function() {
            const name = prompt("File name (e.g. about.html):");
            if(name) {
                update(ref(db, `projects/${currentProjectId}/files`), { [name]: "" });
            }
        }

        window.deleteFile = function(name) {
            if(Object.keys(projectData.files).length <= 1) return alert("Must have one file");
            if(confirm(`Delete ${name}?`)) {
                remove(ref(db, `projects/${currentProjectId}/files/${name.replace('.', ',')}`)); 
                // Note: Firebase keys can't have dots usually, but for this demo we assume simple paths
            }
        }

        // --- ACTIONS ---
        window.runProject = function() {
            // Opens the "Live View" using our URL param router
            const url = `${window.location.origin}${window.location.pathname}?view=${currentProjectId}`;
            window.open(url, '_blank');
        }

        window.shareProject = function() {
            const url = `${window.location.origin}${window.location.pathname}?view=${currentProjectId}`;
            navigator.clipboard.writeText(url);
            alert("Public Link Copied!");
        }

        window.downloadZip = function() {
            const zip = new JSZip();
            Object.keys(projectData.files).forEach(name => {
                zip.file(name, projectData.files[name]);
            });
            zip.generateAsync({type:"blob"}).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `${projectData.name}.zip`;
                link.click();
            });
        }

        window.toggleSettings = function() {
            const m = document.getElementById('settings-modal');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        window.deleteCurrentProject = async function() {
            if(confirm("Delete entire project?")) {
                await remove(ref(db, `projects/${currentProjectId}`));
                window.location.search = "";
            }
        }

        // --- LIVE RENDERER ---
        async function renderLiveSite(id) {
            document.body.innerHTML = "Loading...";
            onValue(ref(db, `projects/${id}`), (snapshot) => {
                const data = snapshot.val();
                if(!data) {
                    document.body.innerHTML = "404 Project Not Found";
                    return;
                }

                const html = data.files['index.html'] || "No index.html found";
                const css = data.files['style.css'] || "";
                const js = data.files['script.js'] || "";

                document.open();
                document.write(html);
                
                // Inject CSS
                const styleTag = document.createElement('style');
                styleTag.innerHTML = css;
                document.head.appendChild(styleTag);

                // Inject JS
                const scriptTag = document.createElement('script');
                scriptTag.innerHTML = js;
                document.body.appendChild(scriptTag);
                
                document.title = data.name;
                document.close();
            });
        }

        // Init
        route();
    </script>
</body>
</html>
