<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI Voice Assistant</title>

<!-- Speech Recognition Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:800px;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.status{
    text-align:center;
    padding:14px;
    background:#334155;
    border-radius:12px;
    margin-bottom:20px;
    font-weight:bold;
}

.box{
    background:#334155;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

.box h3{
    margin-bottom:10px;
    color:#60a5fa;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

.listening{
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 0 rgba(37,99,235,0.7);
    }

    70%{
        box-shadow:0 0 0 20px rgba(37,99,235,0);
    }

    100%{
        box-shadow:0 0 0 0 rgba(37,99,235,0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🎤 AI Voice Assistant</h1>

    <div class="status" id="status">
        Waiting to start...
    </div>

    <div class="box">
        <h3>You Said</h3>
        <p id="userText">...</p>
    </div>

    <div class="box">
        <h3>AI Response</h3>
        <p id="aiText">...</p>
    </div>

    <button id="startBtn">
        Start Assistant
    </button>

</div>

<script>
const startBtn = document.getElementById("startBtn");
const statusBox = document.getElementById("status");
const userText = document.getElementById("userText");
const aiText = document.getElementById("aiText");

let isSpeaking = false;

// ====================================
// OPENROUTER API
// ====================================
const API_KEY =
"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";

// FREE MODEL
const MODEL = "google/gemma-4-26b-a4b-it:free";

// ====================================
// TEXT TO SPEECH
// ====================================
function speak(text){

    isSpeaking = true;

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    speech.onstart = () => {

        statusBox.innerText = "🗣️ AI Speaking...";
        statusBox.classList.remove("listening");
    };

    speech.onend = () => {

        isSpeaking = false;

        statusBox.innerText = "🎤 Listening...";
        statusBox.classList.add("listening");

        annyang.resume();
    };

    speechSynthesis.speak(speech);
}

// ====================================
// ASK AI
// ====================================
async function askAI(message){

    try{

        statusBox.innerText = "🧠 Thinking...";
        statusBox.classList.remove("listening");

        const response = await fetch(
            "https://openrouter.ai/api/v1/chat/completions",
            {
                method:"POST",

                headers:{
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type":"application/json"
                },

                body: JSON.stringify({
                    model: MODEL,

                    messages:[
                        {
                            role:"system",
                            content:
                            "You are a smart AI voice assistant. Keep replies short, natural and conversational."
                        },
                        {
                            role:"user",
                            content:message
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        console.log(data);

        const reply =
            data.choices?.[0]?.message?.content ||
            "Sorry, I couldn't understand.";

        aiText.innerText = reply;

        speak(reply);

    }catch(error){

        console.error(error);

        aiText.innerText = "Error connecting to AI.";

        speak("There was an error connecting to the AI.");
    }
}

// ====================================
// START ASSISTANT
// ====================================
startBtn.addEventListener("click", () => {

    if(!annyang){
        alert("Speech recognition not supported.");
        return;
    }

    // CONTINUOUS LISTENING
    annyang.addCallback("result", async function(userSaid){

        if(isSpeaking) return;

        const transcript = userSaid[0];

        console.log("User:", transcript);

        userText.innerText = transcript;

        annyang.pause();

        await askAI(transcript);
    });

    annyang.addCallback("start", () => {

        statusBox.innerText = "🎤 Listening...";
        statusBox.classList.add("listening");
    });

    annyang.addCallback("error", (error) => {

        console.log(error);

        statusBox.innerText = "⚠️ Microphone Error";
    });

    // START
    annyang.setLanguage("en-US");

    annyang.start({
        autoRestart:true,
        continuous:true
    });

    startBtn.innerText = "Assistant Running";
    startBtn.disabled = true;
});
</script>

</body>
</html>
