<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic</title>
    
    <!-- Firebase -->
    <script type="module" src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js"></script>
    
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Material 3 Light Theme Variables */
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-surface: #FFFBFE;
            --md-sys-color-surface-dim: #DED8E1;
            --md-sys-color-surface-bright: #FFFBFE;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-surface-container-low: #F7F2FA;
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-surface-container-highest: #E6E0E9;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-color-error: #B3261E;
            --md-ref-typeface: 'Roboto', sans-serif;
            --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
            --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px 2px rgba(0,0,0,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--md-ref-typeface);
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            height: 100vh;
            overflow: hidden;
        }

        /* --- MATERIAL 3 COMPONENTS --- */
        .m3-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 24px;
            border-radius: 20px;
            border: none;
            font-family: var(--md-ref-typeface);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: box-shadow 200ms, background-color 200ms;
        }
        .m3-btn-filled {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            box-shadow: var(--md-sys-elevation-1);
        }
        .m3-btn-filled:hover { box-shadow: var(--md-sys-elevation-2); }
        
        .m3-btn-outlined {
            background-color: transparent;
            color: var(--md-sys-color-primary);
            border: 1px solid var(--md-sys-color-outline);
        }
        .m3-btn-outlined:hover { background-color: rgba(103, 80, 164, 0.08); }

        .m3-btn-tonal {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }
        .m3-btn-tonal:hover { box-shadow: var(--md-sys-elevation-1); }

        .m3-btn-text {
            background-color: transparent;
            color: var(--md-sys-color-primary);
            padding: 0 12px;
        }
        .m3-btn-text:hover { background-color: rgba(103, 80, 164, 0.08); }

        .m3-icon-btn {
            width: 40px; height: 40px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .m3-icon-btn:hover { background-color: rgba(28, 27, 31, 0.08); }

        .m3-card-elevated {
            background-color: var(--md-sys-color-surface-container-low);
            border-radius: 12px;
            box-shadow: var(--md-sys-elevation-1);
            padding: 16px;
            cursor: pointer;
            transition: box-shadow 200ms, transform 150ms;
        }
        .m3-card-elevated:hover {
            box-shadow: var(--md-sys-elevation-2);
            transform: translateY(-2px);
        }

        .m3-dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .m3-dialog-overlay.active { display: flex; }
        
        .m3-dialog {
            background-color: var(--md-sys-color-surface-container-high);
            border-radius: 28px;
            padding: 24px;
            min-width: 320px;
            max-width: 560px;
            box-shadow: var(--md-sys-elevation-3);
        }
        .m3-dialog-title { font-size: 24px; font-weight: 500; margin-bottom: 16px; color: var(--md-sys-color-on-surface); }
        .m3-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }

        .m3-textfield {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--md-sys-color-outline);
            background: transparent;
            color: var(--md-sys-color-on-surface);
            font-family: var(--md-ref-typeface);
            font-size: 16px;
            outline: none;
            transition: border-color 200ms;
        }
        .m3-textfield:focus { border-color: var(--md-sys-color-primary); }

        /* --- LAYOUT --- */
        .loading-screen {
            position: fixed; inset: 0;
            background: var(--md-sys-color-surface);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            width: 48px; height: 48px;
            border: 4px solid var(--md-sys-color-surface-container-highest);
            border-top-color: var(--md-sys-color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- PROJECT LIST VIEW --- */
        #view-projects {
            height: 100vh;
            overflow-y: auto;
            padding: 32px;
            background-color: var(--md-sys-color-surface-dim);
        }
        .projects-header {
            max-width: 1200px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .projects-title { font-size: 28px; font-weight: 700; color: var(--md-sys-color-on-surface); }
        .projects-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        /* --- EDITOR VIEW --- */
        #view-editor { display: none; height: 100vh; flex-direction: column; background: var(--md-sys-color-surface); }
        
        .editor-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background-color: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
        }
        .project-name-input {
            border: none;
            background: transparent;
            font-size: 18px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            width: 250px;
            padding: 8px;
            border-radius: 8px;
        }
        .project-name-input:focus { background-color: var(--md-sys-color-surface-container-high); outline: none; }
        
        .file-tabs-container {
            display: flex;
            align-items: center;
            background-color: var(--md-sys-color-surface-container);
            padding: 0 8px;
            overflow-x: auto;
        }
        .file-tab {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            position: relative;
        }
        .file-tab.active {
            color: var(--md-sys-color-primary);
            border-bottom-color: var(--md-sys-color-primary);
            background-color: var(--md-sys-color-surface-container-lowest);
            border-radius: 8px 8px 0 0;
        }
        .file-tab .delete-file-btn {
            margin-left: 8px;
            width: 18px; height: 18px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .file-tab:hover .delete-file-btn { display: flex; }
        .file-tab .delete-file-btn:hover { background-color: rgba(179, 38, 30, 0.1); color: var(--md-sys-color-error); }

        .editor-area { flex-grow: 1; overflow: hidden; }

        /* CodeMirror Material 3 Overrides */
        .CodeMirror {
            height: 100%;
            background-color: var(--md-sys-color-surface-container-lowest);
            color: var(--md-sys-color-on-surface);
            font-family: 'Roboto Mono', monospace;
        }
        .CodeMirror-gutters {
            background-color: var(--md-sys-color-surface-container-low);
            border-right: 1px solid var(--md-sys-color-outline-variant);
        }
        .CodeMirror-linenumber { color: var(--md-sys-color-outline); }
        .CodeMirror-cursor { border-left: 2px solid var(--md-sys-color-primary); }
        .CodeMirror-selected { background: rgba(103, 80, 164, 0.2) !important; }
        .cm-s-default .cm-keyword { color: #6750A4; font-weight: 500; }
        .cm-s-default .cm-def { color: #0061A4; }
        .cm-s-default .cm-variable { color: #1C1B1F; }
        .cm-s-default .cm-string { color: #386A20; }
        .cm-s-default .cm-tag { color: #0061A4; }
        .cm-s-default .cm-attribute { color: #6750A4; }

        /* Public Render View */
        #view-render { display: none; position: fixed; inset: 0; background: white; z-index: -1; }
        #view-render iframe { width: 100%; height: 100%; border: none; }

        /* Notification SnackBar */
        .snackbar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--md-sys-color-on-surface);
            color: var(--md-sys-color-surface);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 2000;
            transition: transform 300ms cubic-bezier(0.2, 0, 0, 1);
            box-shadow: var(--md-sys-elevation-3);
        }
        .snackbar.show { transform: translateX(-50%) translateY(0); }

        .share-link-box {
            display: flex; gap: 8px; margin-bottom: 12px; align-items: center;
        }
        .share-link-box input {
            flex: 1; padding: 10px; border: 1px solid var(--md-sys-color-outline); border-radius: 8px;
            background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface); font-size: 14px;
        }

    </style>
</head>
<body>

    <div class="loading-screen" id="loading"><div class="loading-spinner"></div></div>

    <!-- VIEW 1: Project List -->
    <div id="view-projects" style="display:none;">
        <div class="projects-header">
            <h1 class="projects-title">Mimic</h1>
            <button class="m3-btn m3-btn-filled" id="btn-new-project">
                <span class="material-icons-round" style="font-size:18px;">add</span> New Project
            </button>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
    </div>

    <!-- VIEW 2: Editor -->
    <div id="view-editor">
        <div class="editor-top-bar">
            <div style="display:flex; align-items:center; gap:8px;">
                <button class="m3-icon-btn" id="btn-back"><span class="material-icons-round">arrow_back</span></button>
                <input type="text" class="project-name-input" id="inp-project-name" placeholder="Project Name">
                <button class="m3-icon-btn" id="btn-settings"><span class="material-icons-round">tune</span></button>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="m3-btn m3-btn-tonal" id="btn-save-zip">
                    <span class="material-icons-round" style="font-size:18px;">download</span> Save
                </button>
                <button class="m3-btn m3-btn-filled" id="btn-run">
                    <span class="material-icons-round" style="font-size:18px;">play_arrow</span> Run
                </button>
                <button class="m3-btn m3-btn-outlined" id="btn-share">
                    <span class="material-icons-round" style="font-size:18px;">share</span> Share
                </button>
            </div>
        </div>
        <div class="file-tabs-container" id="file-tabs">
            <!-- Tabs injected here -->
            <button class="m3-icon-btn" id="btn-add-file" title="Add File"><span class="material-icons-round">note_add</span></button>
        </div>
        <div class="editor-area">
            <textarea id="cm-textarea"></textarea>
        </div>
    </div>

    <!-- VIEW 3: Public Renderer (Fallback 404 view) -->
    <div id="view-render"><iframe id="render-iframe"></iframe></div>

    <!-- MODALS -->
    <!-- Add File Modal -->
    <div class="m3-dialog-overlay" id="modal-add-file">
        <div class="m3-dialog">
            <div class="m3-dialog-title">Create New File</div>
            <input type="text" class="m3-textfield" id="inp-new-file" placeholder="e.g., app.js, utils.css">
            <div class="m3-dialog-actions">
                <button class="m3-btn m3-btn-text" onclick="closeModal('modal-add-file')">Cancel</button>
                <button class="m3-btn m3-btn-filled" id="btn-confirm-add-file">Create</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="m3-dialog-overlay" id="modal-share">
        <div class="m3-dialog">
            <div class="m3-dialog-title">Share Project</div>
            <p style="margin-bottom:16px; color:var(--md-sys-color-on-surface-variant); font-size:14px;">Anyone with these links can view the running project.</p>
            <label style="font-size:12px; color:var(--md-sys-color-on-surface-variant); margin-bottom:4px; display:block;">PUBLIC LINK</label>
            <div class="share-link-box"><input type="text" id="link-public" readonly><button class="m3-btn m3-btn-tonal" onclick="copyLink('link-public')">Copy</button></div>
            <label style="font-size:12px; color:var(--md-sys-color-on-surface-variant); margin-bottom:4px; display:block;">PRIVATE LINK</label>
            <div class="share-link-box"><input type="text" id="link-private" readonly><button class="m3-btn m3-btn-tonal" onclick="copyLink('link-private')">Copy</button></div>
            <div class="m3-dialog-actions">
                <button class="m3-btn m3-btn-text" onclick="closeModal('modal-share')">Close</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="m3-dialog-overlay" id="modal-settings">
        <div class="m3-dialog">
            <div class="m3-dialog-title">Settings</div>
            <div style="display:flex; flex-direction:column; gap:16px;">
                <div>
                    <label style="font-size:14px; color:var(--md-sys-color-on-surface-variant);">Tab Size</label>
                    <input type="number" class="m3-textfield" id="set-tabsize" value="2" min="1" max="8" style="margin-top:8px;">
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="font-size:14px; color:var(--md-sys-color-on-surface-variant);">Word Wrap</label>
                    <label class="material-icons-round" style="cursor:pointer; color:var(--md-sys-color-primary); font-size:32px;" id="toggle-wrap">
                        <input type="checkbox" style="display:none;" id="set-wordwrap">
                        check_box_outline_blank
                    </label>
                </div>
            </div>
            <div class="m3-dialog-actions">
                <button class="m3-btn m3-btn-text" onclick="closeModal('modal-settings')">Cancel</button>
                <button class="m3-btn m3-btn-filled" id="btn-save-settings">Apply</button>
            </div>
        </div>
    </div>

    <div class="snackbar" id="snackbar"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBk_9ZoyexrPZON-JowtMeNgWCzpfsQyeM",
            authDomain: "mimic-799e5.firebaseapp.com",
            databaseURL: "https://mimic-799e5-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mimic-799e5",
            storageBucket: "mimic-799e5.firebasestorage.app",
            messagingSenderId: "914081698620",
            appId: "1:914081698620:web:2bb171c9afb66efa66c439",
            measurementId: "G-5TP997CQC8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const BASE_URL = "https://bw00111.github.io/mimic";

        // State
        let currentProjectId = null;
        let projectData = null;
        let currentFileName = "index.html";
        let editor = null;
        let saveTimeout = null;

        // --- UTILITY FUNCTIONS ---
        function showView(viewId) {
            document.querySelectorAll('[id^="view-"]').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = viewId === 'view-editor' ? 'flex' : 'block';
        }

        function showSnackbar(msg) {
            const sb = document.getElementById('snackbar');
            sb.textContent = msg;
            sb.classList.add('show');
            setTimeout(() => sb.classList.remove('show'), 3000);
        }

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        window.copyLink = (id) => {
            navigator.clipboard.writeText(document.getElementById(id).value);
            showSnackbar("Link copied!");
        };

        function getModeFromFilename(name) {
            if (name.endsWith('.html') || name.endsWith('.htm')) return 'htmlmixed';
            if (name.endsWith('.css')) return 'css';
            if (name.endsWith('.js')) return 'javascript';
            if (name.endsWith('.json')) return 'application/json';
            return 'text/plain';
        }

        // --- PUBLIC VIEW LOGIC (Fixes 404) ---
        async function handlePublicRoute() {
            const path = window.location.pathname;
            let isPublic = path.includes('/pub/');
            let isPrivate = path.includes('/pv/');
            
            if (!isPublic && !isPrivate) return false;

            // Extract ID: remove trailing slash if exists, then get last part
            const parts = path.replace(/\/$/, '').split('/');
            const projectId = parts[parts.length - 1];

            try {
                const snap = await get(ref(db, `projects/${projectId}`));
                if (snap.exists()) {
                    const data = snap.val();
                    document.title = data.name || "Mimic Project";
                    
                    // Build combined HTML to inject into iframe
                    let htmlContent = data.files['index.html'] || '<h1>No index.html found</h1>';
                    
                    // Inject other CSS files into head if they aren't linked
                    Object.keys(data.files).forEach(fName => {
                        if (fName.endsWith('.css') && !htmlContent.includes(fName)) {
                            htmlContent = htmlContent.replace('</head>', `<style>\n${data.files[fName]}\n</style>\n</head>`);
                        }
                        if (fName.endsWith('.js') && fName !== 'script.js' && !htmlContent.includes(fName)) {
                            htmlContent = htmlContent.replace('</body>', `<script>\n${data.files[fName]}\n<\/script>\n</body>`);
                        }
                    });

                    // Inject script.js specifically if not linked (common default)
                    if(data.files['script.js'] && !htmlContent.includes('script.js')) {
                        htmlContent = htmlContent.replace('</body>', `<script>\n${data.files['script.js']}\n<\/script>\n</body>`);
                    }

                    document.getElementById('loading').style.display = 'none';
                    showView('view-render');
                    document.getElementById('render-iframe').srcdoc = htmlContent;
                    return true;
                }
            } catch(e) { console.error(e); }
            
            document.body.innerHTML = `<div style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:sans-serif;color:#333;">Project not found or error loading.</div>`;
            return true;
        }

        // --- PROJECT LIST VIEW ---
        async function loadProjects() {
            showView('view-projects');
            document.getElementById('loading').style.display = 'none';
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';

            const snap = await get(ref(db, 'projects'));
            if (!snap.exists()) {
                grid.innerHTML = '<p style="color:var(--md-sys-color-on-surface-variant)">No projects yet.</p>';
                return;
            }

            Object.entries(snap.val()).forEach(([id, proj]) => {
                const card = document.createElement('div');
                card.className = 'm3-card-elevated';
                const date = proj.lastModified ? new Date(proj.lastModified).toLocaleDateString() : '';
                card.innerHTML = `
                    <h3 style="margin-bottom:8px; font-weight:500;">${proj.name || 'Untitled'}</h3>
                    <p style="font-size:12px; color:var(--md-sys-color-on-surface-variant);">Modified: ${date}</p>
                `;
                card.onclick = () => openEditor(id);
                grid.appendChild(card);
            });
        }

        async function createProject() {
            const id = Date.now().toString();
            const newProj = {
                name: "Untitled Project",
                lastModified: Date.now(),
                files: {
                    "index.html": "<!DOCTYPE html>\n<html>\n<head>\n  <title>New Project</title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <h1>Hello World</h1>\n  <script src=\"script.js\"><\/script>\n</body>\n</html>",
                    "style.css": "body {\n  font-family: sans-serif;\n  padding: 20px;\n  background: #f0f0f0;\n}",
                    "script.js": "console.log('Ready to code!');"
                }
            };
            await set(ref(db, `projects/${id}`), newProj);
            openEditor(id);
        }

        // --- EDITOR VIEW ---
        async function openEditor(id) {
            currentProjectId = id;
            const snap = await get(ref(db, `projects/${id}`));
            if (!snap.exists()) return showSnackbar("Project deleted");
            
            projectData = snap.val();
            document.getElementById('inp-project-name').value = projectData.name;
            
            showView('view-editor');
            initEditorIfNeeded();
            renderTabs();
            switchFile("index.html");
        }

        function initEditorIfNeeded() {
            if (editor) return;
            editor = CodeMirror.fromTextArea(document.getElementById('cm-textarea'), {
                lineNumbers: true, tabSize: 2, indentUnit: 2, mode: 'htmlmixed'
            });
            editor.on('change', () => {
                if (!projectData) return;
                projectData.files[currentFileName] = editor.getValue();
                // Debounce Autosave
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(autoSaveToFirebase, 1500);
            });
        }

        function renderTabs() {
            const container = document.getElementById('file-tabs');
            container.innerHTML = ''; // clear old tabs
            
            Object.keys(projectData.files).forEach(fName => {
                const tab = document.createElement('div');
                tab.className = `file-tab ${fName === currentFileName ? 'active' : ''}`;
                tab.innerHTML = `
                    <span onclick="window.switchTab('${fName}')">${fName}</span>
                    ${Object.keys(projectData.files).length > 1 ? `<button class="delete-file-btn" onclick="event.stopPropagation(); window.deleteFile('${fName}')">×</button>` : ''}
                `;
                container.appendChild(tab);
            });

            // Re-append the add file button at the end
            const addBtn = document.createElement('button');
            addBtn.className = 'm3-icon-btn';
            addBtn.id = 'btn-add-file';
            addBtn.title = 'Add File';
            addBtn.innerHTML = '<span class="material-icons-round">note_add</span>';
            addBtn.onclick = () => document.getElementById('modal-add-file').classList.add('active');
            container.appendChild(addBtn);
        }

        window.switchTab = (fName) => switchFile(fName);

        function switchFile(fName) {
            currentFileName = fName;
            editor.setValue(projectData.files[fName] || "");
            editor.setOption('mode', getModeFromFilename(fName));
            editor.clearHistory();
            renderTabs(); // update active state
            setTimeout(() => editor.refresh(), 10);
        }

        window.deleteFile = async (fName) => {
            if (Object.keys(projectData.files).length <= 1) return showSnackbar("Must have at least one file");
            if (!confirm(`Delete ${fName}?`)) return; // Simple confirmation for destructive action
            
            delete projectData.files[fName];
            const newFirstFile = Object.keys(projectData.files)[0];
            
            await update(ref(db, `projects/${currentProjectId}/files`), projectData.files);
            switchFile(newFirstFile);
            showSnackbar(`Deleted ${fName}`);
        };

        window.addNewFile = async () => {
            const inp = document.getElementById('inp-new-file');
            let fName = inp.value.trim();
            if (!fName) return;
            if (!fName.includes('.')) return showSnackbar("Please include file extension (e.g. .js)");
            if (projectData.files[fName]) return showSnackbar("File already exists");

            projectData.files[fName] = "";
            await update(ref(db, `projects/${currentProjectId}/files`), projectData.files);
            
            closeModal('modal-add-file');
            inp.value = '';
            switchFile(fName);
            showSnackbar(`Created ${fName}`);
        };

        async function autoSaveToFirebase() {
            if (!currentProjectId) return;
            projectData.name = document.getElementById('inp-project-name').value;
            projectData.lastModified = Date.now();
            await update(ref(db, `projects/${currentProjectId}`), projectData);
        }

        function downloadZip() {
            if (!projectData) return;
            const zip = new JSZip();
            Object.entries(projectData.files).forEach(([name, content]) => zip.file(name, content));
            zip.generateAsync({ type: "blob" }).then(blob => {
                saveAs(blob, `${projectData.name.replace(/\s+/g, '_')}.zip`);
            });
        }

        function runProject() {
            if (!currentProjectId) return;
            autoSaveToFirebase(); // Force save before running
            window.open(`${BASE_URL}/pub/${currentProjectId}`, '_blank');
        }

        function openShareModal() {
            if (!currentProjectId) return;
            document.getElementById('link-public').value = `${BASE_URL}/pub/${currentProjectId}`;
            document.getElementById('link-private').value = `${BASE_URL}/pv/${currentProjectId}`;
            document.getElementById('modal-share').classList.add('active');
        }

        function applySettings() {
            const size = parseInt(document.getElementById('set-tabsize').value) || 2;
            const wrap = document.getElementById('set-wordwrap').checked;
            if (editor) {
                editor.setOption('tabSize', size);
                editor.setOption('indentUnit', size);
                editor.setOption('lineWrapping', wrap);
            }
            closeModal('modal-settings');
            showSnackbar("Settings applied");
        }

        // Toggle checkbox UI hack
        document.getElementById('toggle-wrap').addEventListener('click', function() {
            const cb = document.getElementById('set-wordwrap');
            cb.checked = !cb.checked;
            this.innerHTML = cb.checked ? 'check_box' : 'check_box_outline_blank';
        });

        // --- INIT & EVENT LISTENERS ---
        async function init() {
            // 1. Handle Public Routing First
            if (await handlePublicRoute()) return;

            // 2. Initialize IDE
            document.getElementById('btn-new-project').onclick = createProject;
            document.getElementById('btn-back').onclick = () => { currentProjectId = null; projectData = null; loadProjects(); };
            document.getElementById('btn-save-zip').onclick = downloadZip;
            document.getElementById('btn-run').onclick = runProject;
            document.getElementById('btn-share').onclick = openShareModal;
            document.getElementById('btn-settings').onclick = () => document.getElementById('modal-settings').classList.add('active');
            document.getElementById('btn-save-settings').onclick = applySettings;
            document.getElementById('btn-confirm-add-file').onclick = window.addNewFile;

            // Allow enter key in add file modal
            document.getElementById('inp-new-file').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') window.addNewFile();
            });

            loadProjects();
        }

        init();
    </script>
</body>
</html>
