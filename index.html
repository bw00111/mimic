<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High-FPS Hand Tracking</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent scroll on mobile */
        }

        /* The canvas where we draw the 3D hand */
        #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        /* The hidden video element for input */
        #input-video {
            position: absolute;
            top: 0;
            left: 0;
            /* transform: scaleX(-1);  Don't mirror rear camera usually, but depends on preference */
            visibility: hidden; /* Hide the raw video */
            width: 1px;
            height: 1px;
        }

        /* Loading Overlay */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: #0ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 { font-size: 1.5rem; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 0.9rem; color: #888; margin-top: 10px; }

        /* Controls hint */
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <h1>Initializing Neural Link</h1>
        <p>Loading AI Models & Camera...</p>
    </div>

    <!-- Input Source -->
    <video id="input-video" playsinline></video>

    <!-- Output 3D Scene -->
    <canvas id="output-canvas"></canvas>

    <div id="controls-hint">Allow camera access. Best performance in landscape.</div>

    <!-- Import Libraries from High-Performance CDNs -->
    <!-- Three.js for 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands for Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        /**
         * CONFIGURATION & STATE
         */
        const config = {
            cameraWidth: 1280, // Try high res, will fallback if needed
            cameraHeight: 720,
            smoothness: 0.5, // 0.0 (laggy) to 1.0 (instant/jittery). 0.5-0.7 is usually sweet spot.
            lowLightMode: true // Adds contrast to help tracking in dark
        };

        const state = {
            isLoaded: false,
            landmarksLeft: [], // Store previous frame for smoothing
            landmarksRight: []
        };

        // DOM Elements
        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const loadingScreen = document.getElementById('loading');

        /**
         * THREE.JS SCENE SETUP
         * We build a "Cyber Hand" using primitives (Spheres & Cylinders) to ensure low RAM usage.
         */
        const scene = new THREE.Scene();
        // Add fog for depth
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 2;

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({
            canvas: canvasElement,
            alpha: true,
            antialias: false // Turn off AA for extreme performance boost
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for 1GB devices

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00ffff, 1);
        dirLight.position.set(2, 5, 5);
        scene.add(dirLight);

        /**
         * HAND MESH GENERATOR
         * Creates a hierarchical structure of joints and bones.
         */
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],         // Thumb
            [0, 5], [5, 6], [6, 7], [7, 8],         // Index
            [0, 9], [9, 10], [10, 11], [11, 12],    // Middle
            [0, 13], [13, 14], [14, 15], [15, 16],  // Ring
            [0, 17], [17, 18], [18, 19], [19, 20],  // Pinky
            [5, 9], [9, 13], [13, 17]               // Palm
        ];

        class CyberHand {
            constructor(color) {
                this.meshGroup = new THREE.Group();
                this.joints = []; // Array of sphere meshes
                this.bones = [];  // Array of cylinder meshes
                this.targetPositions = new Array(21).fill(null); // Current raw targets
                this.currentPositions = []; // Smoothed positions

                // Materials - Reuse to save memory
                this.jointMaterial = new THREE.MeshPhongMaterial({ color: color, shininess: 100 });
                this.boneMaterial = new THREE.MeshPhongMaterial({ color: 0x444444, shininess: 50 });

                // Initialize 21 joints
                const jointGeo = new THREE.SphereGeometry(0.03, 8, 6); // Low poly sphere
                for (let i = 0; i < 21; i++) {
                    const mesh = new THREE.Mesh(jointGeo, this.jointMaterial);
                    this.joints.push(mesh);
                    this.meshGroup.add(mesh);
                    
                    // Initialize current positions off-screen
                    this.currentPositions.push(new THREE.Vector3(0,0,0));
                }

                // Initialize bones (connections)
                const boneGeo = new THREE.CylinderGeometry(0.015, 0.015, 1, 6, 1);
                // Rotate geometry so cylinder aligns with Y axis initially (makes scaling easier)
                boneGeo.translate(0, 0.5, 0); 
                boneGeo.rotateX(Math.PI / 2);

                for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
                    const mesh = new THREE.Mesh(boneGeo, this.boneMaterial);
                    this.bones.push({
                        mesh: mesh,
                        startIdx: HAND_CONNECTIONS[i][0],
                        endIdx: HAND_CONNECTIONS[i][1]
                    });
                    this.meshGroup.add(mesh);
                }

                scene.add(this.meshGroup);
            }

            updateLandmarks(landmarks) {
                if (!landmarks) {
                    this.meshGroup.visible = false;
                    return;
                }
                this.meshGroup.visible = true;

                // 1. Process Raw Data (Mirror X for rear cam feel if needed, but MediaPipe standard is normalized)
                // Map 2D/3D screen coords to 3D world coords
                for (let i = 0; i < 21; i++) {
                    const lm = landmarks[i];
                    // Normalize x: 0->1 becomes -1.5->1.5 (approx)
                    // Normalize y: 0->1 becomes 1.0->-1.0 (invert Y)
                    
                    // Simple projection
                    const x = (0.5 - lm.x) * 3.5; 
                    const y = (0.5 - lm.y) * 3.5; // Invert Y
                    const z = -lm.z * 3.0; // Depth

                    this.targetPositions[i].set(x, y, z);
                }

                // 2. Smooth Movement (Lerp)
                for (let i = 0; i < 21; i++) {
                    if (this.currentPositions[i].distanceTo(this.targetPositions[i]) > 0.001) {
                        this.currentPositions[i].lerp(this.targetPositions[i], config.smoothness);
                    }
                    // Update Joint Mesh
                    this.joints[i].position.copy(this.currentPositions[i]);
                }

                // 3. Update Bones
                for (let i = 0; i < this.bones.length; i++) {
                    const bone = this.bones[i];
                    const startPos = this.currentPositions[bone.startIdx];
                    const endPos = this.currentPositions[bone.endIdx];

                    const mesh = bone.mesh;
                    mesh.position.copy(startPos);
                    mesh.lookAt(endPos);
                    
                    // Scale distance
                    const distance = startPos.distanceTo(endPos);
                    mesh.scale.set(1, 1, distance);
                }
            }
        }

        // Create instances for left and right hands
        const leftHand = new CyberHand(0x00ffff); // Cyan
        const rightHand = new CyberHand(0xff00ff); // Magenta

        /**
         * MEDIAPIPE SETUP
         */
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1, // 0 is fastest, 1 is more accurate. 1 is usually safe on modern phones.
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            // Hide loading screen on first successful frame
            if (!state.isLoaded) {
                state.isLoaded = true;
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 500);
            }

            // Reset targets first
            for(let i=0; i<21; i++) {
                if(!leftHand.targetPositions[i]) leftHand.targetPositions[i] = new THREE.Vector3();
                if(!rightHand.targetPositions[i]) rightHand.targetPositions[i] = new THREE.Vector3();
            }

            if (results.multiHandLandmarks && results.multiHandedness) {
                for (let index = 0; index < results.multiHandLandmarks.length; index++) {
                    const classification = results.multiHandedness[index];
                    const isRightHand = classification.label === 'Right';
                    const landmarks = results.multiHandLandmarks[index];

                    if (isRightHand) {
                        rightHand.updateLandmarks(landmarks);
                        leftHand.meshGroup.visible = false;
                    } else {
                        leftHand.updateLandmarks(landmarks);
                        rightHand.meshGroup.visible = false;
                    }
                }
            } else {
                leftHand.meshGroup.visible = false;
                rightHand.meshGroup.visible = false;
            }
        });

        /**
         * CAMERA SETUP
         * Constraints optimization for FPS.
         */
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: config.cameraWidth,
            height: config.cameraHeight
        });

        // Custom start to handle constraints specifically
        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: 'environment', // Rear camera
                    width: { ideal: config.cameraWidth },
                    height: { ideal: config.cameraHeight },
                    frameRate: { ideal: 60 } // Try to request high FPS
                },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                
                // Low light filter: boost contrast on the video element
                // This doesn't affect the visual output (video is hidden), but affects the frame data sent to AI
                if(config.lowLightMode) {
                   videoElement.style.filter = "contrast(1.2) brightness(1.1) saturate(1.2)";
                }

                await videoElement.play();

                // Start the loop
                processVideo();
                
            } catch (err) {
                console.error("Camera Error:", err);
                alert("Could not access camera. Please ensure permissions are granted and you are using HTTPS.");
                loadingScreen.innerHTML = `<h1 style="color:red">Camera Error</h1><p>${err.message}</p>`;
            }
        }

        /**
         * MAIN LOOP
         */
        function processVideo() {
            // We use async/await inside the loop via MediaPipe's send, 
            // but the rendering loop is separate to keep FPS high.
            
            // We send image to MediaPipe
            hands.send({image: videoElement}).catch(e => {
                // Ignore sporadic errors
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Render 3D scene regardless of AI speed (decoupling render from AI detection)
            // This ensures the 3D scene doesn't stutter if AI lags slightly
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Orientation Hint
        window.addEventListener("orientationchange", function() {
            // Simple reload or adjustment could go here
            console.log("Orientation changed");
        });

        // Start
        animate();
        startCamera();

    </script>
</body>
</html>
